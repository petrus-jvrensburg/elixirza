  - title: "March Erlang & Elixir Meetup • RenoHash: Building a startup from scratch in Elixir & Phoenix"
    date: "Tuesday, March 26, 2024 19:00 (GMT+2)"
    url: "https://www.meetup.com/elixirza/events/299153319/"
    image: "/images/speakers/vusi-mosena_elixirza.png"
    description: >-
      Vusi Mosena, founder of <a href="https://renohash.co.za" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">https://renohash.co.za</a> gave us some insight into his creative process, showing how he's been tackling the challenge of building a startup. With Renohash his approach has been to write as little code as possible: just enough to validate the approach taken for each step. The focus for him is really on building the business... get that right, and then the software will follow.
