  - title: "November Erlang & Elixir Meetup • Stephan Bothma & Dylan Blakemore"
    date: "Tuesday, November 26, 2024 19:00 (GMT+2)"
    url: "https://youtu.be/yKVN4_GK7sE"
    image: "/images/speakers/stephan-bothma_dylan-blakemore.png"
    description: >-
      Stephan Bothma walked us through a project at <a href="https://flickswitch.co.za" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Flickswitch</a> where he used GenServer to handle the provisioning and activation of SIM cards at scale across Africa.
      Dylan Blakemore, Senior Engineering Manager at <a href="https://www.zappi.io" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Zappi</a>, shared his experience growing an Elixir team inside a company that started as a Ruby on Rails shop — covering the challenges and wins of convincing an organisation to adopt Elixir, and building up a team around it.
    links:
      - type: github
        url: "https://github.com/DylanBlakemore"
      - type: linkedin
        url: "https://za.linkedin.com/in/stephan-bothma-37b5b5191"
      - type: linkedin
        url: "https://www.linkedin.com/in/dylan-blakemore-a9198a11b/"

  - title: "July Erlang & Elixir Meetup • Boost Your Data Team's Productivity with Explorer"
    date: "Tuesday, July 16, 2024 19:00 (GMT+2)"
    url: "https://youtu.be/5N4qTX8JBek"
    image: "/images/speakers/christopher-grainger-elixirza.png"
    description: >-
      At <a href="https://www.amplified.ai" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">https://www.amplified.ai</a>, Chirstopher Grainger has built powerful tools that help his customers (e.g. patent attorneys) make sense of millions of patent records, issued from all over the world, in very little time. Behind the scenes Amplified uses some cutting-edge functionality enabled by LLMs, together with a bunch of traditional machine learning techniques that do a lot of the heavy lifting.<br>
      One piece of their stack that is easily overlooked, but surprisingly useful for working with large datasets, is <a href="https://github.com/elixir-explorer/explorer" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">the Explorer library</a>, of which Chris is the author. In this talk, he gives a quick overview of what it does, and what makes it useful, before ripping out a livebook and showing us what it all looks like in practice.
    links:
      - type: x
        url: "https://x.com/cigrainger"
      - type: github
        url: "https://github.com/cigrainger"
      - type: linkedin
        url: "https://www.linkedin.com/in/cigrainger/"

