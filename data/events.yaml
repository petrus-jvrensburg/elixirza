    image: "/images/speakers/wayne-pringle-wood_and_danie-palm_elixirza.png"
    description: >-
      Danie Palm showed us how he built a binary parser at <a href="https://www.lifeq.com" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">LifeQ</a>, using Elixir's builtin binary matching features to come up with an elegant parsing function that handles dynamic content efficiently.
      Wayne Pringle-Wood shared some of the challenges they faced at <a href="https://flickswitch.co.za" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Flickswitch</a> when scaling their GenServer-based architecture as their usage grew.
