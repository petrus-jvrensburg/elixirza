  - title: "January Erlang & Elixir Meetup • TAMING THE BEAST: STRUCTURED OUTPUT FROM ERRATIC LLMS"
    date: "Tuesday, January 30, 2024 19:00 (GMT+2)"
    url: "https://www.meetup.com/elixirza/events/297977016/"
    image: "/images/speakers/thomas-millar_elixirza.png"
    description: >-
      Thomas Millar, the maintainer of <a href="https://github.com/thmsmlr/instructor_ex" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Elixir's Instructor library</a>, joined us for a fascinating chat about using 'structured prompting' to integrate LLMs into your Elixir applications. His library helps you get structured output from LLMs using a combination of 'function calling', Ecto changesets and good-old Ecto validation functions. This removes a bunch of complexity from your code, making it much easier to leverage the power of LLMs in your own applications.
    links:
      - type: x
        url: "https://x.com/thmsmlr"
      - type: linkedin
        url: "https://www.linkedin.com/in/thmsmlr/"
      - type: github
        url: "https://github.com/thmsmlr"

