  - title: "October Erlang & Elixir Meetup • Lightning Talks"
    date: "Tuesday, October 31, 2023 7:00 PM (GMT+2)"
    url: "https://www.meetup.com/elixirza/events/290550744/"
    description: >-
      <a href="https://www.linkedin.com/in/ross-shardlow-34838a136/" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Ross Shardlow</a> shared a bit about his experience using credo for static code analysis. He has been using it at Slerp, where the Elixir team is distributed across diverse timezones. Credo runs in their CI/CD pipeline, checking for several issues out-of-the-box, but Ross showed how they went a step further and implemented a set of custom credo checks for things that are important to them. And surprisingly, it was a rather simple process, involving a callback function and some pattern matching on the parsed code that is being checked.<br>
      <a href="https://www.linkedin.com/in/wkirschbaum/" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Wilhelm Kirschbaum</a> shared a bit about the Tree-sitter parsing library, and showed what parsed elixir code looks like. Lastly, <a href="https://www.linkedin.com/in/petrus-janse-van-rensburg-0517a7223/" target="_blank" class="text-violet-600 hover:text-violet-700 cursor:pointer">Petrus Janse van Rensburg</a> highlighted a couple of fantastic recent conference talks and showed how simple it can be to render live time-series plots in LiveView using plain SVG and Tailwind for styling.

  - title: "September Erlang & Elixir Meetup • RAGE AGAINST THE MACHINE: NEURAL NETWORKS IN ELIXIR"
    date: "Thursday, September 14, 2023 7:00 PM (GMT+2)"
    url: "https://www.meetup.com/elixirza/events/290550739/"
    image: "/images/speakers/sean-moriarity_elixirza.png"
    description: >-
      Sean Moriarity joined us for a chat about all things Machine Learning in Elixir. He's the lead developer of Axon, a library for implementing Neural Nets on the BEAM, as well as being deeply involved in the development of Nx (Numerical Elixir), which Axon uses for number crunching.<br />
      Recently, Sean released <a class="text-violet-600 hover:text-violet-700 cursor:pointer" href="https://pragprog.com/titles/smelixir/machine-learning-in-elixir/" target="_blank" title="Machine Learning in Elixir - Learning to Learn with Nx and Axon">a new book in Beta</a> on PragProg, so if this stuff interests you (and it should), then go grab yourself a copy.
    links:
      - type: x
        url: "https://x.com/sean_moriarity"
      - type: github
        url: "https://github.com/seanmor5"

  - title: "July Erlang & Elixir Meetup • HOW WE USE ELIXIR AT OPENFN"
    date: "Tuesday, July 11, 2023 7:00 PM (GMT+2)"
    url: "https://www.meetup.com/elixirza/events/290550712/"
    image: "/images/speakers/stuart-corbishley_elixirza.png"
    description: >-
      Stuart Corbishley spoke about some of the interesting projects he's been working on around the world, together with the <a class="text-violet-600 hover:text-violet-700 cursor:pointer" href="https://openfn.org" target="_blank" title="OpenFn">OpenFn.org</a> team. For the past eight years, they have been helping governments and NGOs integrate disparate software systems, using mostly Elixir (for orchestration) and Javascript (for running background jobs). They provide an accessible low-code solution for solving tech-related problems in the public sector, often in situations where a modest chunk of code can have an outsized impact on people's livelihood.
