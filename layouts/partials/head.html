<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">

<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.description }}">

<!-- social sharing -->
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:image" content="{{ .Site.Params.organization.logo }}">
<meta property="og:url" content="{{ .Site.BaseURL }}">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Site.Title }}">
<meta name="twitter:description" content="{{ .Site.Params.description }}">
<meta name="twitter:image" content="{{ .Site.Params.organization.logo }}">

<link rel="canonical" href="{{ .Site.BaseURL }}">

<script type="application/ld+json">
{{ dict
    "@context" "https://schema.org"
    "@type" "Organization"
    "@id" .Site.BaseURL
    "name" .Site.Params.organization.name
    "url" .Site.BaseURL
    "address" (dict
        "@type" "PostalAddress"
        "addressLocality" .Site.Params.organization.addressLocality
        "addressCountry" .Site.Params.organization.addressCountry
        "postalCode" .Site.Params.organization.postalCode
        "streetAddress" .Site.Params.organization.streetAddress
    )
    "logo" .Site.Params.organization.logo
    "description" .Site.Params.description
    "sameAs" .Site.Params.organization.sameAs
    | jsonify | safeJS }}
</script>

<!-- favicons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ "apple-touch-icon.png" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16x16.png" | relURL }}">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
<link rel="mask-icon" href="{{ "safari-pinned-tab.svg" | relURL }}" color="#5bbad5">
<meta name="msapplication-TileColor" content="#da532c">
<meta name="theme-color" content="#ffffff">

<link href="{{ "css/output.css" | relURL }}" rel="stylesheet">
